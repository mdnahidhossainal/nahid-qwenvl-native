name: Build Android Native SO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK/NDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Clone llama.cpp
        run: |
          rm -rf third_party
          mkdir -p third_party
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git third_party/llama.cpp

      - name: Configure llama.cpp Android shared libraries
        run: |
          cmake -S third_party/llama.cpp -B build-llama-android \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DGGML_OPENMP=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_LLAMAFILE=OFF \
            -DGGML_CUDA=OFF \
            -DGGML_METAL=OFF \
            -DGGML_VULKAN=OFF \
            -DGGML_BLAS=OFF \
            -DGGML_RPC=OFF \
            -DGGML_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_BUILD_TOOLS=OFF \
            -DLLAMA_CURL=OFF

      - name: Show available native library targets
        run: |
          echo "---- Available targets containing ggml/llama ----"
          cmake --build build-llama-android --target help | grep -E "(^| )([A-Za-z0-9_-]*)(ggml|llama)([A-Za-z0-9_-]*)" || true

      - name: Build only library targets, not apps
        run: |
          set -e
          echo "---- Building ggml and llama library targets only ----"
          cmake --build build-llama-android --config Release --target ggml -j2
          cmake --build build-llama-android --config Release --target llama -j2
          echo "---- Built .so files ----"
          find build-llama-android -type f -name "*.so" -print -exec ls -lh {} \;

      - name: Build Nahid JNI wrapper
        run: |
          cmake -S . -B build-nahid-wrapper \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-nahid-wrapper --config Release -j2

      - name: Collect SO files
        run: |
          rm -rf artifact
          mkdir -p artifact/arm64-v8a
          cp build-nahid-wrapper/libnahid_qwenvl.so artifact/arm64-v8a/
          find build-llama-android -type f -name "*.so" -print -exec cp {} artifact/arm64-v8a/ \;
          echo "---- artifact files ----"
          find artifact -type f -maxdepth 3 -print -exec ls -lh {} \;
          echo "---- count ----"
          find artifact/arm64-v8a -type f -name "*.so" | wc -l
          test $(find artifact/arm64-v8a -type f -name "*.so" | wc -l) -ge 2

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libnahid_qwenvl_llamacpp_arm64_v8a_stage5e_d
          path: artifact
          if-no-files-found: error
