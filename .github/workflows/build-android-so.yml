name: Build Android Native SO

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK/NDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;26.1.10909125" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Clone llama.cpp
        run: |
          rm -rf /tmp/llama.cpp
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp

      - name: Configure llama.cpp Android library-only build
        run: |
          cmake -S /tmp/llama.cpp -B /tmp/llama.cpp/build-android \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DLLAMA_BUILD_APPS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_CURL=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF

      - name: Show available llama.cpp targets
        run: |
          cmake --build /tmp/llama.cpp/build-android --target help > /tmp/llama_targets.txt || true
          echo "---- targets containing llama/ggml/mtmd/llava/clip ----"
          grep -E "(^|[ /])(llama|ggml|mtmd|llava|clip)" /tmp/llama_targets.txt | head -n 200 || true

      - name: Build core llama.cpp shared libraries
        run: |
          cmake --build /tmp/llama.cpp/build-android --config Release --target ggml ggml-base ggml-cpu llama -j2
          find /tmp/llama.cpp/build-android -name "*.so" -print

      - name: Build multimodal shared library target if available
        run: |
          set -e
          TARGETS="$(cat /tmp/llama_targets.txt || true)"
          if echo "$TARGETS" | grep -qE '(^|[[:space:]])mtmd($|[[:space:]:])'; then
            echo "MTMD_TARGET=mtmd" >> $GITHUB_ENV
            cmake --build /tmp/llama.cpp/build-android --config Release --target mtmd -j2
          elif echo "$TARGETS" | grep -qE '(^|[[:space:]])llava($|[[:space:]:])'; then
            echo "MTMD_TARGET=llava" >> $GITHUB_ENV
            cmake --build /tmp/llama.cpp/build-android --config Release --target llava -j2
          elif echo "$TARGETS" | grep -qE '(^|[[:space:]])clip($|[[:space:]:])'; then
            echo "MTMD_TARGET=clip" >> $GITHUB_ENV
            cmake --build /tmp/llama.cpp/build-android --config Release --target clip -j2
          else
            echo "No known multimodal library target found. Available related targets:"
            grep -E "(^|[ /])(mtmd|llava|clip|qwen|vision|image)" /tmp/llama_targets.txt | head -n 200 || true
            exit 1
          fi
          echo "Built multimodal target: ${MTMD_TARGET}"
          find /tmp/llama.cpp/build-android -name "*.so" -print

      - name: Locate shared libraries
        run: |
          LLAMA_SO=$(find /tmp/llama.cpp/build-android -name "libllama.so" | head -n 1)
          GGML_SO=$(find /tmp/llama.cpp/build-android -name "libggml.so" | head -n 1)
          GGML_BASE_SO=$(find /tmp/llama.cpp/build-android -name "libggml-base.so" | head -n 1)
          GGML_CPU_SO=$(find /tmp/llama.cpp/build-android -name "libggml-cpu.so" | head -n 1)
          MTMD_SO=$(find /tmp/llama.cpp/build-android -name "libmtmd.so" | head -n 1)
          LLAVA_SO=$(find /tmp/llama.cpp/build-android -name "libllava.so" | head -n 1)
          CLIP_SO=$(find /tmp/llama.cpp/build-android -name "libclip.so" | head -n 1)
          echo "LLAMA_SO=$LLAMA_SO" >> $GITHUB_ENV
          echo "GGML_SO=$GGML_SO" >> $GITHUB_ENV
          echo "GGML_BASE_SO=$GGML_BASE_SO" >> $GITHUB_ENV
          echo "GGML_CPU_SO=$GGML_CPU_SO" >> $GITHUB_ENV
          echo "MTMD_SO=$MTMD_SO" >> $GITHUB_ENV
          echo "LLAVA_SO=$LLAVA_SO" >> $GITHUB_ENV
          echo "CLIP_SO=$CLIP_SO" >> $GITHUB_ENV
          echo "LLAMA_SO=$LLAMA_SO"
          echo "GGML_SO=$GGML_SO"
          echo "GGML_BASE_SO=$GGML_BASE_SO"
          echo "GGML_CPU_SO=$GGML_CPU_SO"
          echo "MTMD_SO=$MTMD_SO"
          echo "LLAVA_SO=$LLAVA_SO"
          echo "CLIP_SO=$CLIP_SO"
          test -n "$LLAMA_SO"
          test -n "$GGML_SO"
          test -n "$GGML_BASE_SO"
          test -n "$GGML_CPU_SO"
          test -n "$MTMD_SO$LLAVA_SO$CLIP_SO"

      - name: Configure Nahid JNI wrapper Stage 5H-Lite safe multimodal symbol probe
        run: |
          cmake -S . -B build-nahid-wrapper \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLAMA_CPP_DIR=/tmp/llama.cpp \
            -DLLAMA_SO="$LLAMA_SO" \
            -DGGML_SO="$GGML_SO" \
            -DGGML_BASE_SO="$GGML_BASE_SO" \
            -DGGML_CPU_SO="$GGML_CPU_SO"

      - name: Build Nahid JNI wrapper
        run: |
          cmake --build build-nahid-wrapper --config Release -j2

      - name: Collect SO files
        run: |
          rm -rf artifact/arm64-v8a
          mkdir -p artifact/arm64-v8a
          cp "$GGML_SO" artifact/arm64-v8a/libggml.so
          cp "$GGML_BASE_SO" artifact/arm64-v8a/libggml-base.so
          cp "$GGML_CPU_SO" artifact/arm64-v8a/libggml-cpu.so
          cp "$LLAMA_SO" artifact/arm64-v8a/libllama.so
          if [ -n "$MTMD_SO" ]; then cp "$MTMD_SO" artifact/arm64-v8a/libmtmd.so; fi
          if [ -n "$LLAVA_SO" ]; then cp "$LLAVA_SO" artifact/arm64-v8a/libllava.so; fi
          if [ -n "$CLIP_SO" ]; then cp "$CLIP_SO" artifact/arm64-v8a/libclip.so; fi
          cp build-nahid-wrapper/libnahid_qwenvl.so artifact/arm64-v8a/libnahid_qwenvl.so
          ls -lah artifact/arm64-v8a

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libnahid_qwenvl_stage5h_lite_safe_multimodal_symbol_probe_arm64_v8a
          path: artifact
