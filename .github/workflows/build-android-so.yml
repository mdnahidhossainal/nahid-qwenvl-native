name: Build Android Native SO

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK/NDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;26.1.10909125" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Clone llama.cpp
        run: |
          rm -rf /tmp/llama.cpp
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp

      - name: Configure llama.cpp Android library-only build
        run: |
          cmake -S /tmp/llama.cpp -B /tmp/llama.cpp/build-android \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DLLAMA_BUILD_APPS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_CURL=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF

      - name: Build exact llama.cpp library targets
        run: |
          cmake --build /tmp/llama.cpp/build-android --config Release --target ggml ggml-base ggml-cpu llama -j2
          find /tmp/llama.cpp/build-android -name "*.so" -print

      - name: Locate llama.cpp shared libraries
        run: |
          LLAMA_SO=$(find /tmp/llama.cpp/build-android -name "libllama.so" | head -n 1)
          GGML_SO=$(find /tmp/llama.cpp/build-android -name "libggml.so" | head -n 1)
          GGML_BASE_SO=$(find /tmp/llama.cpp/build-android -name "libggml-base.so" | head -n 1)
          GGML_CPU_SO=$(find /tmp/llama.cpp/build-android -name "libggml-cpu.so" | head -n 1)
          echo "LLAMA_SO=$LLAMA_SO" >> $GITHUB_ENV
          echo "GGML_SO=$GGML_SO" >> $GITHUB_ENV
          echo "GGML_BASE_SO=$GGML_BASE_SO" >> $GITHUB_ENV
          echo "GGML_CPU_SO=$GGML_CPU_SO" >> $GITHUB_ENV
          test -n "$LLAMA_SO"
          test -n "$GGML_SO"
          test -n "$GGML_BASE_SO"
          test -n "$GGML_CPU_SO"

      - name: Configure Nahid JNI wrapper Stage 5G text-generation probe
        run: |
          cmake -S . -B build-nahid-wrapper \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLAMA_CPP_DIR=/tmp/llama.cpp \
            -DLLAMA_SO="$LLAMA_SO" \
            -DGGML_SO="$GGML_SO" \
            -DGGML_BASE_SO="$GGML_BASE_SO" \
            -DGGML_CPU_SO="$GGML_CPU_SO"

      - name: Build Nahid JNI wrapper
        run: |
          cmake --build build-nahid-wrapper --config Release -j2

      - name: Collect SO files
        run: |
          rm -rf artifact/arm64-v8a
          mkdir -p artifact/arm64-v8a
          cp "$GGML_SO" artifact/arm64-v8a/libggml.so
          cp "$GGML_BASE_SO" artifact/arm64-v8a/libggml-base.so
          cp "$GGML_CPU_SO" artifact/arm64-v8a/libggml-cpu.so
          cp "$LLAMA_SO" artifact/arm64-v8a/libllama.so
          cp build-nahid-wrapper/libnahid_qwenvl.so artifact/arm64-v8a/libnahid_qwenvl.so
          ls -lah artifact/arm64-v8a

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libnahid_qwenvl_stage5g_text_generation_probe_arm64_v8a
          path: artifact
