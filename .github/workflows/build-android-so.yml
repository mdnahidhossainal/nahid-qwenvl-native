name: Build Android Native SO

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK/NDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Clone llama.cpp
        run: |
          rm -rf llama.cpp
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git llama.cpp

      - name: Build llama.cpp shared libs for Android arm64
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/26.1.10909125"
          cmake -S llama.cpp -B llama-build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DGGML_OPENMP=OFF \
            -DGGML_NATIVE=OFF
          cmake --build llama-build --config Release -j2

      - name: Build Nahid JNI wrapper
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/26.1.10909125"
          cmake -S . -B nahid-build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build nahid-build --config Release -j2

      - name: Collect SO files
        run: |
          mkdir -p artifact/arm64-v8a
          find llama-build -name "libggml*.so" -exec cp -v {} artifact/arm64-v8a/ \;
          find llama-build -name "libllama.so" -exec cp -v {} artifact/arm64-v8a/ \;
          find llama-build -name "libmtmd.so" -exec cp -v {} artifact/arm64-v8a/ \;
          cp -v nahid-build/libnahid_qwenvl.so artifact/arm64-v8a/
          ls -lh artifact/arm64-v8a

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libnahid_qwenvl_stage5j_handle_mtmd_symbol_probe_arm64_v8a
          path: artifact
