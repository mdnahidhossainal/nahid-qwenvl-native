name: Build Android Native SO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Nahid wrapper repo
        uses: actions/checkout@v4

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Clone llama.cpp
        run: |
          rm -rf external/llama.cpp
          mkdir -p external
          git clone --depth 1 https://github.com/ggml-org/llama.cpp external/llama.cpp

      - name: Configure llama.cpp Android shared libraries only
        run: |
          mkdir -p build-llama-android
          cmake -S external/llama.cpp -B build-llama-android \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DLLAMA_BUILD_APPS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_CURL=OFF \
            -DGGML_OPENMP=OFF \
            -DGGML_NATIVE=OFF

      - name: List build targets for debugging
        run: |
          cmake --build build-llama-android --target help | tee build_targets.txt || true

      - name: Build only required shared-library targets
        run: |
          set +e
          cmake --build build-llama-android --target ggml --config Release -j2
          cmake --build build-llama-android --target ggml-base --config Release -j2
          cmake --build build-llama-android --target ggml-cpu --config Release -j2
          cmake --build build-llama-android --target llama --config Release -j2
          cmake --build build-llama-android --target mtmd --config Release -j2
          set -e
          echo "=== Built shared libraries ==="
          find build-llama-android -name "*.so" -print | sort
          test -f "$(find build-llama-android -name libllama.so | head -1)"
          test -f "$(find build-llama-android -name libmtmd.so | head -1)"


      - name: Dump mtmd API header for Stage 5M
        run: |
          mkdir -p artifact
          MTMD_HEADER=$(find external/llama.cpp -name mtmd.h | head -1)
          echo "MTMD_HEADER=$MTMD_HEADER" | tee artifact/README_STAGE5M_MTMD_HEADER.txt
          echo "This artifact is for API signature inspection before calling mtmd_input_chunks/tokenize/eval." >> artifact/README_STAGE5M_MTMD_HEADER.txt
          echo "Do not install these .so files unless instructed; first send mtmd_header_relevant.txt to ChatGPT." >> artifact/README_STAGE5M_MTMD_HEADER.txt
          cp "$MTMD_HEADER" artifact/mtmd_full_header.h
          grep -nE "mtmd_(tokenize|encode|input_chunks|helper_eval|helper_get|helper_decode|bitmap|input_text|input_image|context_params|init_from_file|free)|typedef|struct mtmd|enum mtmd" "$MTMD_HEADER" > artifact/mtmd_header_relevant.txt || true
          echo "=== Relevant mtmd.h lines ==="
          cat artifact/mtmd_header_relevant.txt

      - name: Build Nahid JNI wrapper
        run: |
          mkdir -p build-wrapper
          cmake -S . -B build-wrapper \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLAMA_BUILD_DIR="$GITHUB_WORKSPACE/build-llama-android" \
            -DLLAMA_CPP_DIR="$GITHUB_WORKSPACE/external/llama.cpp"
          cmake --build build-wrapper --config Release -j2

      - name: Collect SO files
        run: |
          mkdir -p artifact/arm64-v8a
          find build-llama-android -name "libggml*.so" -print -exec cp -f {} artifact/arm64-v8a/ \;
          find build-llama-android -name "libllama.so" -print -exec cp -f {} artifact/arm64-v8a/ \;
          find build-llama-android -name "libmtmd.so" -print -exec cp -f {} artifact/arm64-v8a/ \;
          find build-wrapper -name "libnahid_qwenvl.so" -print -exec cp -f {} artifact/arm64-v8a/ \;
          echo "=== Artifact SO files ==="
          ls -lh artifact/arm64-v8a

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libnahid_qwenvl_stage5m_mtmd_header_dump_arm64_v8a
          path: artifact
